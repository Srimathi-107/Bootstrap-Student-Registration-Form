<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-primary-subtle">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-lg-9 col-xl-8">
          <div
            class="card bg-white border-0 shadow-lg rounded-4 overflow-hidden"
          >
            <!-- Header -->
            <div class="bg-primary text-white text-center py-4 px-3">
              <h2 class="fw-bold mb-2">Student Registration</h2>
              <p class="mb-0">Register now and start your learning journey!</p>
            </div>

            <!-- Form -->
            <div class="card-body p-4 p-md-5">
              <form action="#" method="post" enctype="multipart/form-data">
                <!-- Personal Information -->
                <h5 class="text-primary fw-bold mb-3">Personal Information</h5>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="firstName" class="form-label">
                      First Name
                    </label>
                    <input
                      type="text"
                      class="form-control"
                      id="firstName"
                      name="firstName"
                      placeholder="Enter first name"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="lastName" class="form-label"> Last Name </label>
                    <input
                      type="text"
                      class="form-control"
                      id="lastName"
                      name="lastName"
                      placeholder="Enter last name"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="age" class="form-label">Age</label>
                    <input
                      type="number"
                      class="form-control"
                      id="age"
                      name="age"
                      min="16"
                      max="100"
                      placeholder="Enter age"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="dob" class="form-label"> Date of Birth </label>
                    <input
                      type="date"
                      class="form-control"
                      id="dob"
                      name="dob"
                      required
                    />
                  </div>

                  <div class="col-12">
                    <label for="email" class="form-label">
                      Email Address
                    </label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      placeholder="example@gmail.com"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="password" class="form-label"> Password </label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      name="password"
                      minlength="8"
                      placeholder="Minimum 8 characters"
                      required
                    />
                  </div>

                  <div class="col-md-6">
                    <label for="phone" class="form-label"> Phone Number </label>
                    <input
                      type="tel"
                      class="form-control"
                      id="phone"
                      name="phone"
                      pattern="[0-9]{10}"
                      maxlength="10"
                      placeholder="10-digit number"
                      required
                    />
                  </div>
                </div>

                <hr class="my-4" />

                <!-- Course Information -->
                <h5 class="text-primary fw-bold mb-3">Course Information</h5>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="course" class="form-label">
                      Select Course
                    </label>
                    <select
                      class="form-select"
                      id="course"
                      name="course"
                      required
                    >
                      <option value="" selected disabled>
                        Choose a course
                      </option>
                      <option>HTML</option>
                      <option>CSS</option>
                      <option>JavaScript</option>
                      <option>Bootstrap</option>
                      <option>React.js</option>
                      <option>Full Stack Development</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label for="city" class="form-label"> City </label>
                    <input
                      class="form-control"
                      list="cities"
                      id="city"
                      name="city"
                      placeholder="Enter your city"
                      required
                    />

                    <datalist id="cities">
                      <option value="Erode"></option>
                      <option value="Coimbatore"></option>
                      <option value="Chennai"></option>
                      <option value="Bangalore"></option>
                      <option value="Salem"></option>
                      <option value="Tiruppur"></option>
                    </datalist>
                  </div>

                  <div class="col-12">
                    <label for="skills" class="form-label">
                      Current Skill Level
                    </label>
                    <input
                      type="range"
                      class="form-range"
                      id="skills"
                      name="skills"
                      min="1"
                      max="5"
                      value="3"
                    />
                    <div class="d-flex justify-content-between text-secondary">
                      <small>Beginner</small>
                      <small>Intermediate</small>
                      <small>Advanced</small>
                    </div>
                  </div>
                </div>

                <hr class="my-4" />

                <!-- Additional Information -->
                <h5 class="text-primary fw-bold mb-3">
                  Additional Information
                </h5>

                <div class="mb-3">
                  <label class="form-label d-block">
                    Are you a college student?
                  </label>

                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="collegeStudent"
                      id="yes"
                      value="Yes"
                      required
                    />
                    <label class="form-check-label" for="yes"> Yes </label>
                  </div>

                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="collegeStudent"
                      id="no"
                      value="No"
                    />
                    <label class="form-check-label" for="no"> No </label>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label d-block">
                    Is this a paid course?
                  </label>

                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="paidCourse"
                      id="paidYes"
                      value="Yes"
                      required
                    />
                    <label class="form-check-label" for="paidYes"> Yes </label>
                  </div>

                  <div class="form-check form-check-inline">
                    <input
                      class="form-check-input"
                      type="radio"
                      name="paidCourse"
                      id="paidNo"
                      value="No"
                    />
                    <label class="form-check-label" for="paidNo"> No </label>
                  </div>
                </div>

                <div class="mb-4">
                  <label for="resume" class="form-label">
                    Upload Resume (PDF)
                  </label>
                  <input
                    type="file"
                    class="form-control"
                    id="resume"
                    name="resume"
                    accept=".pdf,application/pdf"
                  />
                  <div class="form-text">
                    Please upload your resume in PDF format.
                  </div>
                </div>

                <!-- Buttons -->
                <div class="d-grid gap-2 d-md-flex">
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg flex-fill"
                  >
                    Register Now
                  </button>

                  <button
                    type="reset"
                    class="btn btn-outline-secondary btn-lg flex-fill"
                  >
                    Reset Form
                  </button>
                </div>
              </form>
            </div>

            <!-- Footer -->
            <div class="bg-light text-center py-3 px-2">
              <small class="text-secondary">
                © 2026 Student Registration Form
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
